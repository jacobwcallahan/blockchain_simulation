<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blockchain Simulation</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #101010; color: #eee; }
    button { padding: 8px 14px; border: none; background: #3b82f6; color: white; border-radius: 6px; cursor: pointer; }
    pre { background: #181818; padding: 10px; border-radius: 8px; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Blockchain Simulation (Runs in Your Browser)</h1>
  <button onclick="runSim()">Run Simulation</button>
  <pre id="output"></pre>

  <script type="module">
    let pyodide;
  
    async function initPyodide() {
      const out = document.getElementById("output");
      out.textContent = "Loading Pyodide (5–10 s first time)...";
      pyodide = await loadPyodide();
      await pyodide.loadPackage("micropip");
      const micropip = pyodide.pyimport("micropip");
      await micropip.install("simpy");
      out.textContent = "Pyodide ready! Click Run Simulation.\n";
    }
  
    async function runSim() {
      const out = document.getElementById("output");
      if (!pyodide) {
        out.textContent += "\nPyodide not ready yet...";
        return;
      }
      out.textContent = "Preparing Python files...\n";
  
      // Helper to load local files into Pyodide's in-memory FS
      async function mountFile(path, url) {
        const data = await fetch(url).then(r => r.text());
        pyodide.FS.writeFile(path, data);
      }
  
      try {
        // Create directories
        pyodide.FS.mkdir("/objs");
        pyodide.FS.mkdir("/utils");
  
        // Copy your local Python source files into the virtual FS
        await mountFile("/objs/core.py", "objs/core.py");
        await mountFile("/objs/stats.py", "objs/stats.py");
        await mountFile("/utils/init_objs.py", "utils/init_objs.py");
        await mountFile("/main.py", "main.py");
  
        out.textContent += "Files loaded! Running simulation...\n";
  
        // Capture stdout
        const stdout = pyodide.runPython(`
        import sys
        from io import StringIO
        sys.stdout = StringIO()
        `);

        await pyodide.runPythonAsync(`
import sys
sys.path.append('/')
exec(open('/main.py').read())
`);

        // Get the captured output
        const output = pyodide.runPython('sys.stdout.getvalue()');
        out.textContent += output + "\nSimulation complete!";
      } catch (err) {
        out.textContent += "\n❌ Error: \n" + err;
      }
    }
  
    initPyodide();
    window.runSim = runSim;
  </script>   
</body>
</html>
